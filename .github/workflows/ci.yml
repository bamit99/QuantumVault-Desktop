name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        working-directory: .
        run: npm ci

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny check
        run: cargo deny check

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit

      - name: Verify README test badge matches the source
        shell: bash
        working-directory: .
        run: |
          badge=$(sed -n 's/.*tests-\([0-9]*\)%20passing.*/\1/p' README.md | head -1)
          actual=$(grep -rc "#\[test\]" src-tauri/src --include='*.rs' | awk -F: '{s+=$2} END {print s}')
          echo "README badge: ${badge:-<none>} | #[test] functions in src-tauri/src: ${actual:-0}"
          if [ -z "$badge" ]; then
            echo "::warning::no tests badge found in README.md"
          elif [ "$badge" != "$actual" ]; then
            echo "::error::README test badge ($badge) does not match the $actual #[test] functions in src-tauri/src"
            exit 1
          fi

  build:
    name: Release build (Windows)
    runs-on: windows-latest
    needs: [frontend, rust]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable exe, NSIS and MSI
        run: npm run tauri build

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $targets = @("src-tauri/target/release/quantum-vault-desktop.exe")
          $targets += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $targets += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $lines = foreach ($f in $targets) {
            $p = (Resolve-Path -LiteralPath $f).Path
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash.ToLower()
            "$hash  $(Split-Path $p -Leaf)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          $lines | Write-Output

      - uses: actions/upload-artifact@v4
        with:
          name: quantum-vault-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/quantum-vault-desktop.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
