# cargo-deny configuration for Quantum Vault.
#
# Run from src-tauri/:  cargo deny check
#
# Scope note: advisories are evaluated for the Windows target we actually ship.
# Linux-only transitive crates (D-Bus/rfd) are not part of the shipped binary.

[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
]
all-features = false

[advisories]
ignore = []

[licenses]
# Permissive licences only. Copyleft licences require explicit review because
# this project is distributed as a binary.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  # This project itself: source-available, not an OSI licence (see LICENSE.md).
  "LicenseRef-Proprietary",
]
# Keep the allow-list broad for future dependencies without noisy warnings.
unused-allowed-license = "allow"
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Crates we deliberately do not want in the dependency graph.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
